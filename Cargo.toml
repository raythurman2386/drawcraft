[workspace]
resolver = "3"
members = [
    "crates/geometry",
    "crates/document",
    "crates/command",
    "crates/editor",
    "crates/render",
    "crates/format",
    "crates/session",
    "crates/mcp",
    "crates/app",
    "xtask",
]
default-members = [
    "crates/app",
    "crates/geometry",
    "crates/document",
    "crates/command",
    "crates/editor",
    "crates/render",
    "crates/format",
    "crates/session",
    "crates/mcp",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/raythurman2386/drawcraft"
authors = ["DrawCraft contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
clap = { version = "4", features = ["derive"] }
resvg = "0.46"
tiny-skia = "0.12"
fontdb = "0.23"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
rfd = "0.17"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
