name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: fmt / clippy / test / layers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Layering
        run: cargo run -p xtask -- layers
      - name: Command coverage
        run: cargo run -p xtask -- commands

  wasm:
    name: wasm core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Build core crates for wasm
        run: cargo run -p xtask -- wasm

  fuzz:
    name: fuzz from_json (60s)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      # taiki-e installs a musl-static cargo-fuzz binary; cargo-fuzz defaults
      # --target to its own compile-time triple (musl), which breaks ASAN.
      # Pin the runner host triple so the job builds/runs on gnu.
      - name: Run libFuzzer target
        working-directory: fuzz
        run: cargo +nightly fuzz run from_json --target x86_64-unknown-linux-gnu -- -max_total_time=60
      - name: Upload fuzz artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: |
            fuzz/artifacts
            fuzz/corpus

