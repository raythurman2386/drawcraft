name: Feature Request
description: Suggest a new feature or enhancement for DrawCraft
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a DrawCraft feature!

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What drawing or editing problem does this feature solve?
      placeholder: I'm always frustrated when...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How would you like this to work (tool, shortcut, menu, canvas behavior)?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any other approaches you've considered?

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other relevant information, mockups, sketches, or examples from other drawing apps
